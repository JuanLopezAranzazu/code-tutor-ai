services:
  db:
    image: postgres:16-alpine
    container_name: code-tutor-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code_tutor_ai
    ports:
      - "5432:5432"
    volumes:
      - code_tutor_ai_pgdata:/var/lib/postgresql/data

volumes:
  code_tutor_ai_pgdata:
